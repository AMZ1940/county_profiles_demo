name: Refresh county profiles

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/generate_profiles.py'
      - '.github/workflows/refresh-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate profiles
        run: python scripts/generate_profiles.py
      - name: Commit updated documents
        run: |
          git add docs/
          if git diff --cached --quiet; then
            echo "Profiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated county profiles"
          git push
